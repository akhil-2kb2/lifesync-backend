spring.application.name=lifesync-backend
# ---------------------
# Server Config
# ---------------------
server.port=8080

# ---------------------
# MySQL Database Config
# ---------------------
# Tell Spring Boot to use Asia/Kolkata timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.url=jdbc:mysql://localhost:3306/lifesync_db?serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=5959

# ---------------------
# JPA / Hibernate
# ---------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---------------------
# JWT Secret + Expiry (Optional - used in JWTUtils)
# ---------------------
jwt.secret=dHuIyVefGAkzMgaab342hEsKD0N9tZYdAur/hhZB0lJOzZ4WrWYnzodhqqgRiCLaveTDZOx7Jb8p2DNs12/9fQ==
jwt.expiration=3600000

# ---------------------
# CORS (optional if you plan to call from frontend)
# ---------------------
# You can configure CORS globally or use @CrossOrigin in controllers

# ---------------------
# Logging
# ---------------------
logging.level.org.springframework=INFO


# Enable multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
